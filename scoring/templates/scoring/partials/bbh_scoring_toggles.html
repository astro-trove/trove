{% if show %}
<div style="display:flex; flex-direction:row; align-items:center; flex-wrap:wrap; gap:0.75rem" class="mb-2">
  <a href="{% url 'trove_nonlocalizedevents:toggle-flare-shape-cache' %}?next={{ next|urlencode }}"
     class="btn agn-toggle {% if flare_shape_toggle %}btn-success{% else %}btn-light{% endif %}"
     title="Whether flare timing must also match one of a few specific published BBH-flare emission models, on top of the always-on model-agnostic excursion check.">
    {% if flare_shape_toggle %}&#9745;{% else %}&#9744;{% endif %} Include flare-shape model check
  </a>
</div>
{% endif %}

<style>
  .btn.agn-toggle {
    display: inline-flex;
    align-items: center;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 20px;
  }
</style>
